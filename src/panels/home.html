
<div id="home-page" class="page">

    <div class="container">

        <div class="status-server">

            <img class="" src="">

            <div class="server-status-infos">
                <div class="server-status-name">Light Studio</div>
                <div></div>
            </div>

            <div class="">
                <div></div>
            </div>

        </div>

        <div class="header"></div>

        <div class="light-instance-background"><video class="light-instance-video" muted loop playsinline hidden></video></div>

        <div class="home-bottom">

            <div>
                <div>
                    <br>
                    <span></span>
                </div>
            </div>

        </div>

        <div class="sidebar">

            <div class="sidebar-home">

                <div class="settings-btn icon-settings"><span id="light-home-news-badge" class="light-home-news-badge" hidden aria-live="polite"></span></div>

            </div>

            <div class="social-tab">

                <div class="instance-avatars"></div>

            </div>

            <div class="sidebar-bottom">

                <div class="instance-select">
                    <h1>+</h1>
                </div>

                <div class="player-options">
                    <div class="player-head"></div>
                </div>

            </div>

        </div>

        <div class="instance-popup" role="dialog" aria-modal="true" aria-label="Selector de instancias">
            <div class="instances-background"></div>
            <div class="instances-tab">
                <div class="instances-toolbar">
                    <span class="instances-toolbar-label">INSTANCIAS</span>
                    <label class="instances-search-wrap">
                        <span class="instances-search-icon" aria-hidden="true">⌕</span>
                        <input class="instances-search" type="search" placeholder="Buscar" aria-label="Buscar instancias" autocomplete="off">
                    </label>
                    <button type="button" class="instances-code-toggle" title="Canjear código" aria-label="Canjear código">+</button>
                    <button type="button" class="close-popup" title="Cerrar" aria-label="Cerrar selector">×</button>
                </div>
                <h2 class="instances-title"><span>DISPONIBLES</span> <strong>INSTANCIAS</strong></h2>
                <div class="instances-List"></div>
                <div class="code-unlock-section" hidden>
                    <div class="code-unlock-header">
                        <h3>Canjear código de acceso</h3>
                        <button type="button" class="code-unlock-close" aria-label="Cerrar canje">×</button>
                    </div>
                    <p class="code-unlock-label">Coloca un código de una instancia privada.</p>
                    <div class="code-unlock-input-container">
                        <input type="text" class="code-unlock-input" placeholder="Introduce el código..." autocomplete="off">
                        <button type="button" class="code-unlock-button">CANJEAR</button>
                    </div>
                    <div class="code-unlock-message" role="status" aria-live="polite"></div>
                </div>
            </div>
        </div>

        <div class="play-elements">

            <div class="play-instance">
                <button class="play-btn">PLAY</button>
                <div class="light-media-controls">
                    <div class="light-volume-wrap">
                        <div class="light-volume-popup"><output>50%</output><input type="range" min="1" max="100" value="50" aria-label="Volumen"></div>
                        <button type="button" class="light-sound" aria-label="Activar o silenciar música"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z M16 8q5 4 0 8 M19 5q8 7 0 14"/></svg></button>
                    </div>
                    <button type="button" class="light-motion" aria-label="Alternar fondo animado"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg></button>
                </div>
            </div>

            <div class="info-starting-game">

                <div class="starting-box" id="main-box">

                    <div class="starting-left">

                        <div
                            class="starting-title"
                            id="display-title"
                        >
                            INICIANDO MINECRAFT...
                        </div>

                        <div id="loading-bars-container">

                            <progress
                                value="0"
                                max="100"
                                class="progress-bar"
                                id="p-bar-1"
                            ></progress>

                            <div
                                class="info-starting-game-text"
                                id="info-text"
                            >
                                Conectando...
                            </div>

                            <progress
                                value="0"
                                max="100"
                                class="progress-bar inverse"
                                id="p-bar-2"
                            ></progress>

                            <div
                                class="loading-elapsed"
                                id="loading-elapsed"
                            >
                                00:00
                            </div>

                        </div>

                        <div
                            id="playing-status"
                            style="display: none; opacity: 0;"
                        >
                            <span>Jugando</span>
                        </div>

                    </div>

                    <div
                        class="starting-right"
                        id="image-container"
                    >
                        <img
                            class="starting-icon-big"
                            id="start-img"
                            src="assets/images/instancias/logo.png"
                            alt="Imagen de instancia"
                        >
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
