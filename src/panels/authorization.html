<section class="light-auth-content">
<h1>No autorizado</h1>
<p>El acceso a Light Client está restringido en este momento. Si vas a participar en un evento, proporciona tu nombre de usuario de Minecraft al organizador a través del canal correspondiente de Discord.</p>
<p>Has iniciado sesión como «<strong id="light-auth-name"></strong>».</p>
<p id="light-auth-status" role="status">Esperando autorización del administrador.</p>
<button id="light-auth-logout" type="button">Cerrar sesión</button>
<form id="light-auth-form" class="light-auth-form">
<label for="light-auth-code">Código de autorización</label>
<div><input id="light-auth-code" type="password" placeholder="Introduce tu código" maxlength="128" autocomplete="off"><button type="submit">CANJEAR</button></div>
</form>
</section>
