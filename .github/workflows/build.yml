
name: Light Client Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26.13.1'

      - name: Setup npm
        run: npm install -g npm@11.20.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check environment
        run: |
          node -v
          npm -v
          npm config get install-links

      - name: Install dependencies
        run: npm install --install-links

      - name: Verify Minecraft Java Core
        run: node -p "require.resolve('minecraft-java-core')"

      - name: Build Light Client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
